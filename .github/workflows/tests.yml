name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test,chem]"

      - name: Compile Python sources
        run: python -m compileall -q molactagent tests scripts

      - name: Run tests
        run: python -m pytest -q

  molecular-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned example dependencies
        run: python -m pip install -e ".[chem]" -c examples/molecular/constraints.txt
      - name: Reproduce the recorded SMILES example
        run: |
          molactagent molecular \
            --reference examples/molecular/reference.csv \
            --test examples/molecular/query.csv \
            --id-column id \
            --endpoint @examples/molecular/endpoint.txt \
            --replay examples/molecular/responses.json \
            --output-dir molecular-output
          python - <<'PY'
          import base64
          import json
          import re
          from pathlib import Path

          output = Path("molecular-output")
          result = json.loads((output / "predictions.json").read_text())["predictions"][0]
          assert result["identifier"] == "Q1" and result["label"] == "active"
          assert [row["reference"] for row in result["references"]] == ["A2", "A1", "A3", "I3", "I2", "I1"]
          assert [vote["label"] for vote in result["judgments"]] == ["active"] * 5
          # Cairo's raster encoding can vary by platform. Compare the report
          # around the depictions and check that every embedded PNG is present.
          png = re.compile(rb'(?<=src="data:image/png;base64,)[A-Za-z0-9+/=]+')
          actual = (output / "report.html").read_bytes()
          expected = Path("docs/molecular-example.html").read_bytes()
          depictions = png.findall(actual)
          assert len(depictions) == 9
          assert all(base64.b64decode(value).startswith(b"\x89PNG\r\n\x1a\n") for value in depictions)
          assert png.sub(b"[PNG]", actual) == png.sub(b"[PNG]", expected)
          PY
