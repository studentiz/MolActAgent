name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test,chem]"

      - name: Compile Python sources
        run: python -m compileall -q molactagent tests scripts

      - name: Run tests
        run: python -m pytest -q

  molecular-replay:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned example dependencies
        run: python -m pip install -e ".[chem]" -c examples/molecular/constraints.txt
      - name: Verify published reports and molecular decisions
        run: python scripts/verify_molecular_examples.py
      - name: Match the scientific figures to the recorded cell assay
        run: python motion/scripts/verify_evidence.py
