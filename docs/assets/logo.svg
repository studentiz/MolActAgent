        stroke-linejoin="round"/>
  <path d="M64 37 78 20" fill="none" stroke="url(#molact-gradient)"
        stroke-width="5" stroke-linecap="round"/>
  <circle cx="78" cy="19" r="7" fill="#111827" stroke="#A78BFA" stroke-width="4"/>
  <circle cx="48" cy="10" r="4" fill="#10B981"/>
  <circle cx="17" cy="28" r="4" fill="#0EA5E9"/>
  <circle cx="17" cy="64" r="4" fill="#10B981"/>
  <circle cx="48" cy="82" r="4" fill="#8B5CF6"/>
  <circle cx="79" cy="64" r="4" fill="#0EA5E9"/>
</svg>
