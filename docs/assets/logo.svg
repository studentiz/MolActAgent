<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">MolActAgent</title>
  <desc id="desc">A molecular ring connected to an active agent node.</desc>
  <defs>
    <linearGradient id="molact-gradient" x1="12%" y1="88%" x2="88%" y2="12%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="52%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- A closed molecular scaffold: deliberately distinct from the old C-and-dot mark. -->
