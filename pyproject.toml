[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molactagent"
version = "0.3.0"
description = "Evidence-grounded molecular activity classification for small datasets, with SMILES featurisation, traceable explanations, HTML reports, and a friendly CLI."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
authors = [{ name = "MolActAgent contributors" }]
keywords = ["molecular-activity", "cheminformatics", "smiles", "qsar", "llm", "explainable-ai", "contrastive-learning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "openai>=1.0",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
excel = ["openpyxl>=3.1"]
parquet = ["pyarrow>=14.0"]
chem = ["rdkit>=2023.3"]
xgboost = ["xgboost>=1.7"]
scipy = ["scipy>=1.10"]
test = ["pytest>=7.0", "pyyaml>=6.0"]
all = [
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "pyarrow>=14.0",
    "rdkit>=2023.3",
    "xgboost>=1.7",
    "scipy>=1.10",
]

[project.scripts]
molactagent = "molactagent.cli:main"

[project.urls]
Homepage = "https://github.com/studentiz/MolActAgent"
Repository = "https://github.com/studentiz/MolActAgent"
Issues = "https://github.com/studentiz/MolActAgent/issues"

[tool.setuptools]
packages = [
    "molactagent",
    "molactagent.estimators",
    "molactagent.metrics",
    "molactagent.tl",
    "molactagent.pp",
    "molactagent.datasets",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "real_llm: tests that require a working LLM endpoint (LLM_API.txt or llm_config.jsonc); opt-in via MOLACTAGENT_REAL_LLM=1.",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]
